<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mofh Status</title>
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <main id="status-page" aria-labelledby="page-title">
        <header class="status-page__header">
            <h1 id="page-title">mofh Status</h1>
            <p id="overall-status" class="status-page__summary" role="status" aria-live="polite"
                data-field="overall-status">Checking...</p>
        </header>

        <section id="server" class="status-section" aria-labelledby="server-title">
            <h2 id="server-title">Server</h2>
            <header class="server__header">
                <h3 id="server-name" class="server__name" data-field="server-name"></h3>
                <p id="server-status" class="server__status" role="status" aria-live="polite"
                    data-field="server-status">Checking...</p>
            </header>
            <dl id="server-metrics" class="metric-list" aria-label="Server metrics">
                <div class="metric-list__item">
                    <dt class="metric-list__label">CPU</dt>
                    <dd class="metric-list__value" data-field="cpu-usage"></dd>
                </div>
                <div class="metric-list__item">
                    <dt class="metric-list__label">Memory</dt>
                    <dd class="metric-list__value" data-field="memory-usage"></dd>
                </div>
                <div class="metric-list__item">
                    <dt class="metric-list__label">Disk</dt>
                    <dd class="metric-list__value" data-field="disk-usage"></dd>
                </div>
                <div class="metric-list__item">
                    <dt class="metric-list__label">Temperature</dt>
                    <dd class="metric-list__value" data-field="temperature"></dd>
                </div>
            </dl>
            <details class="server__specs">
                <summary>Specs</summary>
                <table id="server-specs">
                    <caption>Server specifications</caption>
                    <tbody id="server-specs-body"></tbody>
                </table>
            </details>
        </section>

        <section id="services" class="status-section" aria-labelledby="services-title">
            <h2 id="services-title">Services</h2>
            <ol id="services-list" class="service-list" aria-live="polite"></ol>
        </section>

        <section id="uptime" class="status-section" aria-labelledby="uptime-title">
            <h2 id="uptime-title">Uptime</h2>
            <div id="uptime-chart" class="uptime__chart" role="img" aria-label="Uptime history"
                data-field="uptime-chart"></div>
            <dl class="uptime__details">
                <div>
                    <dt>Last reboot</dt>
                    <dd><time id="last-reboot" data-field="last-reboot"></time></dd>
                </div>
            </dl>
        </section>

        <section id="incidents" class="status-section" aria-labelledby="incidents-title">
            <h2 id="incidents-title">Incidents</h2>
            <p id="incidents-summary" class="incidents__summary" role="status" aria-live="polite"
                data-field="incidents-summary"></p>
            <ol id="incidents-list" class="incident-list" aria-live="polite"></ol>
            <p class="incidents__updated">Last update: <time id="last-updated" data-field="last-updated"></time></p>
        </section>
    </main>

    <template id="server-spec-row-template">
        <tr>
            <th scope="row" data-field="label"></th>
            <td data-field="value"></td>
        </tr>
    </template>
    <template id="service-item-template">
        <li class="service-list__item"><span class="service-list__name" data-field="name"></span><span
                class="service-list__status" role="status" data-field="status"></span></li>
    </template>
    <template id="incident-item-template">
        <li class="incident-list__item">
            <article>
                <h3 class="incident-list__title" data-field="title"></h3>
                <p class="incident-list__status" data-field="status"></p><time class="incident-list__timestamp"
                    data-field="timestamp"></time>
            </article>
        </li>
    </template>
    <script src="assets/js/status.js" defer></script>
</body>

</html>
